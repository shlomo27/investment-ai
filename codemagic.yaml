# Codemagic CI — builds the Capacitor apps for both stores.
#
# Why this exists at all: an iOS build requires macOS, and there is no Mac in
# this project. Codemagic rents one per build (free tier: 500 min/month) and
# also handles code signing and upload, which is the fiddliest part of both
# stores.
#
# Before the first run, set these in the Codemagic UI:
#
#   Environment variable group "investment_ai" (mark all as secure):
#     VITE_API_URL                 https://eloquent-optimism-production-52cd.up.railway.app
#                                  (the web front; it proxies /api to the backend)
#     VITE_FIREBASE_API_KEY        from Firebase console → Project settings
#     VITE_FIREBASE_AUTH_DOMAIN
#     VITE_FIREBASE_PROJECT_ID
#     VITE_FIREBASE_MESSAGING_SENDER_ID
#     VITE_FIREBASE_APP_ID
#     VITE_FIREBASE_VAPID_KEY      Cloud Messaging → Web Push certificates
#     VITE_REVENUECAT_IOS_KEY      RevenueCat → Project → API keys (appl_…)
#     VITE_REVENUECAT_ANDROID_KEY  RevenueCat → Project → API keys (goog_…)
#     VITE_GOOGLE_WEB_CLIENT_ID    Google Cloud → Credentials → OAuth client (Web application)
#     VITE_GOOGLE_IOS_CLIENT_ID    Google Cloud → Credentials → OAuth client (iOS)
#
#   Group "firebase_config" (base64-encoded files, both secure):
#     GOOGLE_SERVICES_JSON         base64 of google-services.json     (Android)
#     GOOGLE_SERVICE_INFO_PLIST    base64 of GoogleService-Info.plist (iOS)
#   Produce them with:  base64 -i google-services.json | pbcopy
#   These are NOT committed: they are per-project Firebase credentials and
#   belong in CI secrets, not in git.
#
#   Integrations:
#     App Store Connect API key, named "ilmariai" (the team key, shared with the other apps) → ios_signing + publishing
#   (iOS needs only VITE_API_URL, VITE_REVENUECAT_IOS_KEY and
#   GOOGLE_SERVICE_INFO_PLIST; the VITE_FIREBASE_* values are for web push.)
#     Google Play service account JSON → GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
#
# VITE_API_URL is the one that silently breaks everything if forgotten: the
# app builds and installs cleanly and then cannot reach the backend at all.

definitions:
  # Pinned rather than "latest". Codemagic keeps a separate machine pool per
  # Xcode version, and the newest one (26.6, which "latest" resolved to) was
  # overloaded: builds sat "queued" for over half an hour, and their support
  # confirmed a load spike on that pool and suggested another version. 26.5
  # is the previous release; move forward once the newer pool has capacity.
  env_versions: &env_versions
    node: 22

  # Codemagic takes the paths under a `cache:` key. They were merged into the
  # workflow at top level as `cache_paths:`, which the schema rejects
  # ("android -> cache_paths: extra fields not permitted") before any build.
  cache: &cache
    cache_paths:
      - $HOME/.npm
      - $CM_BUILD_DIR/frontend/node_modules

  install_web: &install_web
    name: Install dependencies and build the web assets
    script: |
      cd frontend
      npm ci
      # Fail loudly rather than shipping an app that cannot reach the API.
      if [ -z "$VITE_API_URL" ]; then
        echo "VITE_API_URL is not set — the app would build fine and then be"
        echo "unable to log in. Set it in the Codemagic environment group."
        exit 1
      fi
      npm run build
      npx cap sync

workflows:

  # ─── Android ──────────────────────────────────────────────────────────────
  android:
    name: Android — Play Store (AAB)
    max_build_duration: 45
    instance_type: linux_x2
    environment:
      <<: *env_versions
      java: 21
      groups:
        - investment_ai
        - firebase_config
      android_signing:
        - investment_ai_keystore
      vars:
        PACKAGE_NAME: "com.investmentai.app"
    cache: *cache
    scripts:
      - name: Place google-services.json
        script: |
          cd frontend
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON is not set — Capacitor skips the"
            echo "google-services Gradle plugin and push notifications are"
            echo "silently dead in the shipped app."
            exit 1
          fi
          echo "$GOOGLE_SERVICES_JSON" | base64 --decode > android/app/google-services.json
      - name: Require the RevenueCat key
        script: |
          # Without it the app builds, installs and runs — and the upgrade
          # button does nothing. App Review always tries the in-app purchase,
          # so a missing key is a rejection under 2.1 (App Completeness).
          if [ -z "$VITE_REVENUECAT_ANDROID_KEY" ]; then
            echo "VITE_REVENUECAT_ANDROID_KEY is not set — purchases would be disabled in the"
            echo "Play Store build. Add it to the investment_ai environment group."
            exit 1
          fi
      - *install_web
      - name: Set version from the build number
        script: |
          cd frontend/android
          # Play rejects an AAB whose versionCode is not higher than the last
          # upload, so derive it from Codemagic's monotonic build number.
          sed -i.bak "s/versionCode 1/versionCode $((BUILD_NUMBER + 1))/" app/build.gradle
      - name: Build the release bundle
        script: |
          cd frontend/android
          ./gradlew bundleRelease
    artifacts:
      - frontend/android/app/build/outputs/**/*.aab
      # No mapping.txt: minifyEnabled is false in the release build type, so
      # nothing is obfuscated and there is no mapping to upload.
    publishing:
      google_play:
        credentials: $GCLOUD_SERVICE_ACCOUNT_CREDENTIALS
        # Start on the internal track. Promote to production by hand in the
        # Play Console once the build has been checked on a real device.
        track: internal
        submit_as_draft: true
      email:
        recipients:
          - shlomo2708@gmail.com
        notify:
          success: true
          failure: true

  # ─── iOS ──────────────────────────────────────────────────────────────────
  ios:
    name: iOS — App Store (TestFlight)
    max_build_duration: 60
    instance_type: mac_mini_m2
    # The App Store Connect API key added in Codemagic (Team settings →
    # Integrations → Developer Portal) under exactly this name. Both the
    # automatic signing below and the TestFlight upload authenticate with it;
    # without this line `auth: integration` has nothing to use and the build
    # fails at signing.
    integrations:
      app_store_connect: ilmariai
    environment:
      <<: *env_versions
      xcode: "26.5"
      # No cocoapods entry on purpose: Capacitor 8 resolves its plugins through
      # Swift Package Manager (ios/App/CapApp-SPM), so this project has no
      # Podfile and no .xcworkspace — only App.xcodeproj.
      groups:
        - investment_ai
        - firebase_config
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.investmentai.app
      vars:
        BUNDLE_ID: "com.investmentai.app"
        XCODE_PROJECT: "frontend/ios/App/App.xcodeproj"
        XCODE_SCHEME: "App"
    cache: *cache
    scripts:
      - name: Place GoogleService-Info.plist
        script: |
          cd frontend
          if [ -z "$GOOGLE_SERVICE_INFO_PLIST" ]; then
            echo "GOOGLE_SERVICE_INFO_PLIST is not set — the app will register"
            echo "for push and never receive anything."
            exit 1
          fi
          echo "$GOOGLE_SERVICE_INFO_PLIST" | base64 --decode > ios/App/App/GoogleService-Info.plist
      - name: Require the RevenueCat key
        script: |
          # Without it the app builds, installs and runs — and the upgrade
          # button does nothing. App Review always tries the in-app purchase,
          # so a missing key is a rejection under 2.1 (App Completeness).
          if [ -z "$VITE_REVENUECAT_IOS_KEY" ]; then
            echo "VITE_REVENUECAT_IOS_KEY is not set — purchases would be disabled in the"
            echo "App Store build. Add it to the investment_ai environment group."
            exit 1
          fi
      - *install_web
      - name: Google sign-in URL scheme
        script: |
          # Google Sign-In returns to the app through a URL scheme made of the
          # iOS client ID reversed. Derived here from the same variable the
          # app reads, so the two can never disagree. Without the variable the
          # Google button is not shown in the app, and no scheme is needed.
          if [ -z "$VITE_GOOGLE_IOS_CLIENT_ID" ]; then
            echo "VITE_GOOGLE_IOS_CLIENT_ID not set — Google sign-in will not be offered on iOS."
            exit 0
          fi
          SCHEME="com.googleusercontent.apps.${VITE_GOOGLE_IOS_CLIENT_ID%.apps.googleusercontent.com}"
          PLIST=frontend/ios/App/App/Info.plist
          /usr/libexec/PlistBuddy -c "Delete :CFBundleURLTypes" "$PLIST" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0 dict" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes array" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleURLTypes:0:CFBundleURLSchemes:0 string $SCHEME" "$PLIST"
          echo "Registered URL scheme $SCHEME"
      - name: Apply signing profiles
        script: |
          # ios_signing (environment, above) has Codemagic fetch or create the
          # distribution certificate and profile through the integration. The
          # manual fetch-signing-files call that stood here needed separate
          # APP_STORE_CONNECT_* and CERTIFICATE_PRIVATE_KEY variables that
          # nothing set.
          xcode-project use-profiles
      - name: Set build number
        script: |
          cd frontend/ios/App
          # App Store Connect rejects a re-used build number for the same
          # version, which is the most common TestFlight upload failure.
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Build the IPA
        script: |
          cd frontend/ios/App
          xcode-project build-ipa \
            --project "App.xcodeproj" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - frontend/ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration
        # Uploads to TestFlight only. Submission for App Store review stays a
        # deliberate manual step — review is where a financial app gets
        # scrutinised, and it should not be triggered by a git push.
        submit_to_testflight: true
        submit_to_app_store: false
      email:
        recipients:
          - shlomo2708@gmail.com
        notify:
          success: true
          failure: true
